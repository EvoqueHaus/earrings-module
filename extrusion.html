<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topitos — Extrusión 3D</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161616;
    --line: rgba(255,255,255,0.12);
    --accent: #ffffff;
    --text: #f5f5f5;
    --text-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
  }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; z-index: 1; display: block; }
  #bgImage {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 0; pointer-events: none; max-width: none;
  }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(to bottom, rgba(28,28,30,0.9), transparent);
  }
  #topbar h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  #topbar a { color: var(--text-dim); font-size: 12px; text-decoration: none; }
  #topbar a:hover { color: var(--text); }
  #hint { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; color: var(--text-dim); }

  #rightPanel {
    position: absolute; top: 56px; right: 16px; z-index: 2;
    width: 220px;
    background: rgba(35,35,38,0.85);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    backdrop-filter: blur(6px);
  }
  #rightPanel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 10px; }
  .finishes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .finish-btn {
    font-size: 11px; padding: 8px 6px; border-radius: 7px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text);
    cursor: pointer; text-align: center;
  }
  .finish-btn.active { border-color: var(--accent); color: var(--accent); }
  #price { font-size: 20px; font-weight: 600; margin: 2px 0 2px; }
  #priceMeta { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }

  button.stem-toggle {
    width: 100%; font-size: 12px; padding: 9px; border-radius: 7px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text);
    cursor: pointer; margin-bottom: 6px;
  }
  button.stem-toggle.active { border-color: var(--accent); color: var(--accent); }
  button.confirm {
    width: 100%; font-size: 13px; font-weight: 600; padding: 10px;
    border-radius: 7px; border: none; background: var(--accent); color: #0a0a0a; cursor: pointer;
  }
  button.confirm:hover { background: #d8d8d8; }

  #stepper {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: 28px;
    padding: 16px 0;
    background: linear-gradient(to top, rgba(28,28,30,0.9), transparent);
  }
  .step { display: flex; align-items: center; gap: 8px; opacity: 0.4; }
  .step.active { opacity: 1; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .step.active .step-dot { background: var(--accent); }
  .step-label { font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; }
</style>
</head>
<body>

<div id="app">
  <img id="bgImage" alt="">
  <canvas id="canvas"></canvas>

  <div id="topbar">
    <h1>Topitos — vista 3D</h1>
    <a href="index.html">← volver al dibujo</a>
  </div>
  <div id="hint" style="position:absolute; top:46px; left:20px; z-index:2;">
    clic derecho: paneo · rueda: zoom · arrastrar gumball: mover vástago · W/E: mover/rotar
  </div>

  <div id="rightPanel">
    <h2>Acabado</h2>
    <div class="finishes">
      <button class="finish-btn" data-finish="plata-mate">Plata mate</button>
      <button class="finish-btn" data-finish="plata-brillante">Plata brillante</button>
      <button class="finish-btn" data-finish="oro-mate">Oro mate</button>
      <button class="finish-btn" data-finish="oro-brillante">Oro brillante</button>
    </div>

    <h2>Vástago</h2>
    <button id="btnStemToggle" class="stem-toggle">Activar gumball</button>

    <h2>Valor estimado</h2>
    <div id="price">$0</div>
    <div id="priceMeta"></div>
    <button id="btnConfirm" class="confirm">Confirmar pedido</button>
  </div>

  <div id="stepper">
    <div class="step"><div class="step-dot"></div><div class="step-label">1 · Importar</div></div>
    <div class="step"><div class="step-dot"></div><div class="step-label">2 · Dibujar</div></div>
    <div class="step active"><div class="step-dot"></div><div class="step-label">3 · Extrusión 3D</div></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.166.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   1. DISEÑO — se recibe desde el editor de curvas (paso 2) vía
   sessionStorage (misma pestaña/dominio). Si no hay nada
   guardado (por ejemplo, abriste este archivo directo para
   probarlo), se usa una figura de muestra.
   ============================================================ */
const STORAGE_KEY = 'topitos-design';
let design = null;
try {
  const raw = sessionStorage.getItem(STORAGE_KEY);
  if (raw) design = JSON.parse(raw);
} catch (err) { console.warn('No se pudo leer el diseño guardado:', err); }

if (!design) {
  console.warn('No hay diseño en sessionStorage — usando figura de muestra para probar esta página sola.');
  design = {
    outerSVG: 'M5,1 C7,1 9,3 9,5 C9,7 7,9 5,9 C3,9 1,7 1,5 C1,3 3,1 5,1 Z',
    holeSVG: 'M5,3.3 C6,3.3 6.7,4 6.7,5 C6.7,6 6,6.7 5,6.7 C4,6.7 3.3,6 3.3,5 C3.3,4 4,3.3 5,3.3 Z',
    totalLengthMm: 30,
  };
}

/* ============================================================
   2. ESCENA
   ============================================================ */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = null; // deja ver el fondo del spreadsheet detrás del canvas

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   3. ACABADOS — 4 combinaciones plata/oro × mate/brillante,
   compartidas por la pieza, el vástago y el clutch.
   ============================================================ */
const FINISHES = {
  'plata-mate':      { color: 0xc7c9cc, roughness: 0.55 },
  'plata-brillante':  { color: 0xd9dbdd, roughness: 0.08 },
  'oro-mate':         { color: 0xcda158, roughness: 0.55 },
  'oro-brillante':    { color: 0xe6b76b, roughness: 0.08 },
};
let currentFinishKey = 'plata-brillante';

const material = new THREE.MeshPhysicalMaterial({
  color: FINISHES[currentFinishKey].color,
  metalness: 1,
  roughness: FINISHES[currentFinishKey].roughness,
  clearcoat: 0.15,
});

function applyFinish(key) {
  currentFinishKey = key;
  const f = FINISHES[key];
  material.color.setHex(f.color);
  material.roughness = f.roughness;
  material.needsUpdate = true;
  document.querySelectorAll('.finish-btn').forEach(b => b.classList.toggle('active', b.dataset.finish === key));
  updatePrice();
}

/* ============================================================
   4. EXTRUSIÓN DE LA PIEZA (0.8mm fijo, con el agujero si existe)
   ============================================================ */
const pieceGroup = new THREE.Group();
scene.add(pieceGroup);

function buildPiece() {
  const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg">
    <path d="${design.outerSVG} ${design.holeSVG || ''}" fill-rule="evenodd"/>
  </svg>`;
  const loader = new SVGLoader();
  const parsed = loader.parse(svgMarkup);

  parsed.paths.forEach((path) => {
    const shapes = SVGLoader.createShapes(path);
    shapes.forEach((shape) => {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.8,
        bevelEnabled: true,
        bevelThickness: 0.05,
        bevelSize: 0.05,
        bevelSegments: 2,
        curveSegments: 32,
      });
      geometry.rotateX(Math.PI); // el SVG queda boca abajo (Y invertida) respecto a Three
      geometry.center();
      const mesh = new THREE.Mesh(geometry, material);
      pieceGroup.add(mesh);
    });
  });
}
buildPiece();

/* ============================================================
   5. VÁSTAGO + CLUTCH (el clutch se repite siempre, fijo en la
   punta del vástago; el vástago se ubica manualmente con el gumball)
   ============================================================ */
const stemGroup = new THREE.Group();
stemGroup.position.set(0, 0, 1.2); // posición inicial, detrás de la pieza — ajustable
scene.add(stemGroup);

const stemMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 10, 20), material);
stemMesh.rotation.x = Math.PI / 2; // el vástago sale hacia +Z por defecto
stemMesh.position.z = 5; // desde la base (pegada a la pieza) hasta la punta
stemGroup.add(stemMesh);

// Clutch/mariposa: siempre se repite en la punta del vástago, sin importar el diseño
const clutchGroup = new THREE.Group();
clutchGroup.position.z = 10;
const clutchDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.35, 20), material);
clutchDisc.rotation.x = Math.PI / 2;
const clutchRing = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.14, 10, 24), material);
clutchGroup.add(clutchDisc, clutchRing);
stemGroup.add(clutchGroup);

/* Gumball (TransformControls) para reubicar el vástago manualmente */
const gumball = new TransformControls(camera, renderer.domElement);
gumball.attach(stemGroup);
gumball.setMode('translate');
gumball.visible = false;
gumball.enabled = false;
scene.add(gumball);
gumball.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });

const btnStemToggle = document.getElementById('btnStemToggle');
btnStemToggle.addEventListener('click', () => {
  const active = !gumball.visible;
  gumball.visible = active;
  gumball.enabled = active;
  btnStemToggle.classList.toggle('active', active);
  btnStemToggle.textContent = active ? 'Gumball activo' : 'Activar gumball';
});
window.addEventListener('keydown', (e) => {
  if (!gumball.enabled) return;
  if (e.key.toLowerCase() === 'w') gumball.setMode('translate');
  if (e.key.toLowerCase() === 'e') gumball.setMode('rotate');
});

/* ============================================================
   6. FONDO Y PRECIOS DESDE EL SPREADSHEET
   Reutiliza el mismo Web App: además del fondo (hoja "Backgroud"),
   ahora también trae los 4 precios por mm desde la hoja "PRICING"
   (B1 plata brillante, B2 plata mate, B3 oro brillante, B4 oro mate).
   ============================================================ */
const BACKGROUND_CONFIG_URL = 'https://script.google.com/macros/s/AKfycbzUR65t2RJ6cuBtM-BxB5bw3loLe9BOZlYnz1FRgChnHtX8BzBR6d5kc4d-hgToGXFH/exec';

const PRICE_PER_MM = {
  'plata-brillante': null,
  'plata-mate': null,
  'oro-brillante': null,
  'oro-mate': null,
};

async function loadBackgroundAndPricing() {
  try {
    const res = await fetch(BACKGROUND_CONFIG_URL);
    const data = await res.json();

    if (typeof data.color === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(data.color)) {
      document.documentElement.style.setProperty('--bg', data.color);
    }
    if (data.image) {
      const img = document.getElementById('bgImage');
      img.src = data.image;
      const scale = Math.min(100, Math.max(10, Number(data.scale) || 100));
      img.style.width = scale + '%';
      img.style.height = 'auto';
    }

    if (data.pricing) {
      PRICE_PER_MM['plata-brillante'] = Number(data.pricing.plataBrillante) || null;
      PRICE_PER_MM['plata-mate'] = Number(data.pricing.plataMate) || null;
      PRICE_PER_MM['oro-brillante'] = Number(data.pricing.oroBrillante) || null;
      PRICE_PER_MM['oro-mate'] = Number(data.pricing.oroMate) || null;
    }
  } catch (err) {
    console.error('No se pudo cargar el fondo/precios desde el spreadsheet:', err);
  } finally {
    updatePrice();
  }
}
loadBackgroundAndPricing();

/* ============================================================
   7. COTIZACIÓN Y CONFIRMAR PEDIDO
   ============================================================ */
function updatePrice() {
  const rate = PRICE_PER_MM[currentFinishKey];
  if (rate == null) {
    document.getElementById('price').textContent = 'Calculando…';
    document.getElementById('priceMeta').textContent = 'Cargando precio desde el spreadsheet';
    return;
  }
  const price = Math.round(design.totalLengthMm * rate);
  document.getElementById('price').textContent = '$' + price.toLocaleString('es-CO');
  document.getElementById('priceMeta').textContent = `${design.totalLengthMm}mm × $${rate}`;
}

document.querySelectorAll('.finish-btn').forEach((btn) => {
  btn.addEventListener('click', () => applyFinish(btn.dataset.finish));
});
applyFinish(currentFinishKey);

document.getElementById('btnConfirm').addEventListener('click', () => {
  const rate = PRICE_PER_MM[currentFinishKey];
  if (rate == null) { alert('El precio todavía se está cargando desde el spreadsheet — espera un momento.'); return; }
  const order = {
    finish: currentFinishKey,
    totalLengthMm: design.totalLengthMm,
    pricePerMm: rate,
    estimatedPrice: Math.round(design.totalLengthMm * rate),
    stemPosition: stemGroup.position.toArray(),
    stemRotation: [stemGroup.rotation.x, stemGroup.rotation.y, stemGroup.rotation.z],
  };
  console.log('Pedido confirmado →', order);
  // TODO(paso 4): enviar `order` al Web App de Apps Script que genera
  // la cotización formal y dispara el correo de alerta (MailApp).
  alert('Pedido registrado en consola — falta conectar el envío de cotización/correo (siguiente paso).');
});

/* ============================================================
   8. LOOP
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
