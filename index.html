<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dtpxoihkf/image/upload/v1786830126/EVOQUE_HAUS_FAVICON_ijlska.jpg">
<title>Topitos — Editor de figura</title>
<script>
  /* "Es móvil" se decide una sola vez y en un solo lugar: pantalla pequeña
     (en cualquier orientación) + puntero grueso. La clase se pone antes de
     pintar para que el layout móvil y el comportamiento del editor nunca
     queden desincronizados — una ventana angosta de escritorio conserva
     todas sus barras. */
  (function () {
    var coarse = window.matchMedia('(pointer: coarse)').matches;
    var small = Math.min(window.innerWidth, window.innerHeight) <= 720;
    if (coarse && small) document.documentElement.classList.add('is-mobile');
    /* Detecta si la app corre dentro de un iframe (p. ej. incrustada en otra
       web). En ese caso se reserva el alto del header de la web contenedora
       (70px en PC) para que ningún elemento de la app quede oculto ni se
       corte el área inferior. */
    try {
      if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
      }
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161616;
    --line: rgba(255,255,255,0.12);
    --accent: #ffffff;
    --text: #f5f5f5;
    --text-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  /* Cuando la app va incrustada en un iframe de otra web (PC), la web contenedora
     tiene un header alto (~70px). Se baja el contenedor principal ese alto y se
     compensa la altura para que el contenido llene el área visible sin que nada
     quede oculto bajo el header ni se corte abajo. */
  html.embedded:not(.is-mobile) #app {
    margin-top: 70px;
    height: calc(100% - 70px);
  }

  button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 7px;
    padding: 8px 14px; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.06); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { color: var(--text-dim); cursor: not-allowed; opacity: 0.5; }
  button.primary { background: var(--accent); color: #0a0a0a; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #d8d8d8; }
  button.primary:disabled { background: rgba(255,255,255,0.22); color: rgba(255,255,255,0.55); opacity: 1; }

  #bgImage {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 0; pointer-events: none; max-width: none;
  }

  /* ---------- PRELUDE ---------- */
  #prelude {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 3s ease;
  }
  #prelude.fading { opacity: 0; pointer-events: none; }
  #preludeLogo {
    max-width: 90%; max-height: 90%; object-fit: contain;
    opacity: 0; transition: opacity .4s ease;
  }
  #preludeLogo.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    #prelude, #preludeLogo { transition-duration: .01ms; }
  }

  /* ---------- COMPUERTA DE TÉRMINOS Y CONDICIONES ---------- */
  #termsGate {
    position: fixed; inset: 0; z-index: 46;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #termsGate .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 30px; width: 380px; max-width: 100%; text-align: center;
  }
  #termsGate h2 { font-size: 16px; margin: 0 0 10px; }
  #termsGate p { font-size: 12px; color: var(--text-dim); line-height: 1.55; margin: 0 0 16px; }
  #termsGate a { color: var(--text); }
  #termsGate label {
    display: flex; align-items: flex-start; gap: 8px; text-align: left;
    font-size: 12px; color: var(--text-dim); margin-bottom: 18px; cursor: pointer;
  }
  #termsGate input[type=checkbox] { margin-top: 2px; accent-color: var(--accent); }
  #termsGate .row { display: flex; flex-direction: column; gap: 8px; }

  /* Selector de idioma en la compuerta inicial (al inicio de todo, sobre los
     términos): arriba a la derecha, alterna únicamente ES/EN. */
  #langStart {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    display: flex; overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px;
    background: rgba(255,255,255,0.04);
  }
  #langStart .ls-opt {
    width: 42px; height: 30px; padding: 0; border: none; border-radius: 0;
    background: transparent; color: var(--text-dim);
    font-family: inherit; font-size: 11px; font-weight: 600; line-height: 1;
    cursor: pointer; letter-spacing: 0.04em;
  }
  #langStart .ls-opt + .ls-opt { border-left: 1px solid var(--line); }
  #langStart .ls-opt.active { background: var(--accent); color: #0a0a0a; }
  #langStart .ls-opt:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.08); }

  /* ---------- PANTALLA DE INICIO ---------- */
  #importScreen {
    position: absolute; inset: 0; z-index: 10;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #importScreen .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 32px; width: 380px; max-width: 100%; text-align: center;
  }
  #importScreen h2 { font-size: 16px; margin: 0 0 8px; }
  #importScreen p { font-size: 12px; color: var(--text-dim); margin: 0 0 22px; line-height: 1.5; }
  #importScreen .row { display: flex; flex-direction: column; gap: 8px; }
  #importStatus { font-size: 11px; color: var(--text-dim); margin-top: 12px; min-height: 14px; }
  #importStatus.error { color: var(--danger); }

  /* PANTALLA DE INICIO en escritorio: pantalla dividida por la mitad.
     Izquierda: video tutorial que llena todo el costado. Derecha: menú con
     su propio fondo claro. En el celular solo queda el menú (sin video). */
  @media (min-width: 721px) {
    #importScreen { padding: 0; align-items: stretch; }
    .import-split {
      display: flex; width: 100%; max-width: none;
      gap: 0; flex-wrap: nowrap; align-items: stretch;
    }
    #importVideoWrap {
      flex: 0 0 50%; width: 50%; height: 100%;
      background: #000; overflow: hidden;
    }
    #importVideo {
      width: 100%; height: 100%; display: block;
      object-fit: cover; border-radius: 0;
    }
    #importScreen .card {
      flex: 0 0 50%; width: 50%; max-width: none;
      margin: 0; border: none; border-radius: 0;
      background: #e1e1e1; padding: 40px 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    #importScreen h2 { color: #2b000c; }
    #importScreen p { color: #2b000c; }
    #importScreen .card .primary { background: #c2c2c2; color: #2b000c; border: none; }
    #importStatus { color: #2b000c; }
    #importStatus.error { color: #a40000; }
  }
  .is-mobile #importVideoWrap { display: none; }
  .is-mobile .import-split { gap: 0; }

  /* ---------- OVERLAY DE CARGA (Lottie) ---------- */
  #loadingOverlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10,10,10,0.78);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
  }
  #loadingOverlay .spinner { width: 84px; height: 84px; }
  #loadingOverlay .msg { font-size: 12px; color: var(--text-dim); letter-spacing: 0.02em; }

  /* ---------- GLOBOS DE AYUDA ----------
     Un letrero a la vez, anclado al control del que habla, y solo cuando ese
     control ya está en pantalla y no hay nada encima (prelude, términos o
     carga). Se cierran con la ✕ o con "Entendido"; "No mostrar más" los apaga
     hasta la próxima sesión. */
  #tourLayer { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
  .tour-tip {
    position: absolute; width: 250px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 10px; padding: 14px 14px 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    pointer-events: auto;
  }
  .tour-tip p { font-size: 12px; line-height: 1.5; color: var(--text); margin: 0 0 12px; }
  .tour-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tour-tip .tour-close {
    position: absolute; top: 2px; right: 4px;
    background: none; border: none; color: var(--text-dim);
    font-size: 15px; line-height: 1; padding: 6px; cursor: pointer;
  }
  .tour-tip .tour-close:hover { color: var(--text); background: none; }
  .tour-tip .tour-skip { font-size: 11px; color: var(--text-dim); padding: 6px 0; }
  .tour-tip .tour-ok { font-size: 12px; padding: 7px 14px; }
</style>
</head>
<body>

<div id="prelude"><img id="preludeLogo" alt=""></div>
<script>
  /* El prelude se muestra una sola vez por sesión. Si el usuario ya lo vio
     (por ejemplo al volver desde el editor 2D), se retira antes del primer
     pintado para que no haya parpadeo. */
  (function () {
    var seen = false;
    try { seen = sessionStorage.getItem('topitos-prelude-shown') === '1'; } catch (e) {}
    if (seen) {
      document.getElementById('prelude').style.display = 'none';
    } else {
      try { sessionStorage.setItem('topitos-prelude-shown', '1'); } catch (e) {}
    }
    window.__preludeSeen = seen;
  })();
</script>

<div id="app">
  <img id="bgImage" alt="">

  <div id="importScreen">
    <div class="import-split">
      <div id="importVideoWrap">
        <video id="importVideo" controls loop playsinline preload="metadata"></video>
      </div>
      <div class="card">
        <h2 data-i18n="importTitle">Empieza el diseño de tus topitos seleccionando una de éstas opciones</h2>
        <p id="importHint"></p>
        <input type="file" id="fileInput" accept=".svg,.dxf,.pdf" hidden>
        <div class="row">
          <button id="btnUpload" class="primary" data-i18n="uploadBtn">Subir archivo</button>
          <button id="btnCatalog" class="primary" data-i18n="catalogBtn">Elegir un motivo</button>
          <button id="btnSkipImport" class="primary" data-i18n="skipImportBtn">Dibujar a mano</button>
        </div>
        <div id="importStatus"></div>
      </div>
    </div>
  </div>

  <div id="termsGate">
    <div id="langStart" role="group" aria-label="Idioma / Language">
      <button type="button" class="ls-opt" data-lang="es">ES</button>
      <button type="button" class="ls-opt" data-lang="en">EN</button>
    </div>
    <div class="card">
      <h2 data-i18n="termsTitle">Antes de empezar</h2>
      <p data-i18n="termsBody">Diseñar tus Topitos implica aceptar nuestras condiciones comerciales (tiempos de entrega, pagos y garantía).</p>
      <label>
        <input type="checkbox" id="termsCheckbox">
        <span data-i18n="termsCheck">He leído y acepto los <a href="https://www.evoquehaus.com/terminos-y-condiciones" target="_blank" rel="noopener">términos y condiciones</a>.</span>
      </label>
      <div class="row"><button id="btnTermsAccept" class="primary" disabled style="width:100%;" data-i18n="termsAccept">Aceptar y continuar</button></div>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="spinner" id="loadingSpinner"></div>
    <div class="msg" id="loadingMsg">Cargando…</div>
  </div>

  <div id="tourLayer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const CONFIG_URL = 'https://script.google.com/macros/s/AKfycbyeFmWfHaxAlFcSrEE0dPK71eNbMomJ4KRtkFe-uRX0NruGBsSL8Sz2rQ-XGactrjYu/exec';
const FILE_IMPORT_KEY = 'topitos-file-import';
const TERMS_KEY = 'topitos-terms-accepted';
const LANG_KEY = 'topitos-lang';
const $ = id => document.getElementById(id);

/* ============================================================
   IDIOMA — selector en la compuerta de términos (arriba a la
   derecha, ES/EN). La interfaz base está escrita en español; al
   cambiar de idioma se recorren los nodos marcados con
   [data-i18n="clave"].
   ============================================================ */
const I18N = {
  es: {
    importTitle: 'Empieza el diseño de tus topitos seleccionando una de éstas opciones',
    uploadBtn: 'Subir archivo',
    catalogBtn: 'Elegir un motivo',
    skipImportBtn: 'Dibujar a mano',
    importMobileHint: 'Si quieres calcar tu propia imagen o diseñar desde cero debes hacerlo desde un computador.',
    termsTitle: 'Antes de empezar',
    termsBody: 'Diseñar tus Topitos implica aceptar nuestras condiciones comerciales (tiempos de entrega, pagos y garantía).',
    termsCheck: 'He leído y acepto los {a}términos y condiciones{/a}.',
    termsAccept: 'Aceptar y continuar',
    loading: 'Cargando…',
    importProcessing: 'Procesando archivo…',
    importPdf: 'La importación de PDF todavía no está lista. Conviértelo a SVG, o usa la imagen como calco en el siguiente paso.',
    importUnknown: 'Formato no reconocido — usa SVG o DXF.',
    importReadFailed: 'No se pudo leer el archivo: ',
    tourNoMore: 'No mostrar más',
    tourOk: 'Entendido',
    tourStart: 'Empieza aquí: sube tu archivo, elige un motivo de la biblioteca o dibuja tu figura a mano.',
    tourStartMobile: 'Empieza aquí: elige un motivo de la biblioteca para tu Topito.',
  },
  en: {
    importTitle: 'Start designing your topitos by selecting one of these options',
    uploadBtn: 'Upload file',
    catalogBtn: 'Choose a motif',
    skipImportBtn: 'Draw by hand',
    importMobileHint: 'If you want to trace your own image or design from scratch you must do it from a computer.',
    termsTitle: 'Before you start',
    termsBody: 'Designing your Topitos means accepting our commercial conditions (delivery times, payments and warranty).',
    termsCheck: 'I have read and accept the {a}terms and conditions{/a}.',
    termsAccept: 'Accept and continue',
    loading: 'Loading…',
    importProcessing: 'Processing file…',
    importPdf: 'PDF import is not ready yet. Convert it to SVG, or use the image as a trace in the next step.',
    importUnknown: 'Unrecognized format — use SVG or DXF.',
    importReadFailed: 'Could not read the file: ',
    tourNoMore: 'Don\'t show again',
    tourOk: 'Got it',
    tourStart: 'Start here: upload your file, choose a motif from the library or draw your figure by hand.',
    tourStartMobile: 'Start here: choose a motif from the library for your Topito.',
  },
};

let currentLang = 'es';
try { currentLang = sessionStorage.getItem(LANG_KEY) || 'es'; } catch (e) {}
if (I18N[currentLang] === undefined) currentLang = 'es';

function t(key) {
  const table = I18N[currentLang] || I18N.es;
  return table[key] !== undefined ? table[key] : (I18N.es[key] !== undefined ? I18N.es[key] : key);
}

function applyLanguage() {
  const table = I18N[currentLang] || I18N.es;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const val = table[el.getAttribute('data-i18n')];
    if (val !== undefined) {
      const anchor = el.querySelector('a');
      if (anchor && val.indexOf('{a}') !== -1) {
        el.innerHTML = val.replace('{a}', '<a href="https://www.evoquehaus.com/terminos-y-condiciones" target="_blank" rel="noopener">').replace('{/a}', '</a>');
      } else {
        el.textContent = val;
      }
    }
  });
  const langStart = $('langStart');
  if (langStart) langStart.querySelectorAll('.ls-opt').forEach((b) => b.classList.toggle('active', b.dataset.lang === currentLang));
  const importHint = $('importHint');
  if (importHint && isMobile) importHint.textContent = table.importMobileHint;
}

function setLanguage(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  try { sessionStorage.setItem(LANG_KEY, lang); } catch (e) {}
  document.documentElement.lang = lang;
  applyLanguage();
}

/* Un solo punto de verdad para "es móvil": pantalla pequeña + puntero grueso. */
const isMobile = document.documentElement.classList.contains('is-mobile');

// Banderas de arranque: los globos de ayuda esperan a que no haya nada encima.
let preludeDone = !!window.__preludeSeen;
let termsDone = false;

/* ============================================================
   OVERLAY DE CARGA — evita que el usuario insista con más clics
   mientras el archivo se transfiere al editor.
   ============================================================ */
const LOADING_LOTTIE_JSON = {
  v: '5.9.0', fr: 30, ip: 0, op: 90, w: 200, h: 200, nm: 'spinner', ddd: 0, assets: [],
  layers: [{
    ddd: 0, ind: 1, ty: 4, nm: 'ring', sr: 1,
    ks: {
      o: { a: 0, k: 100 },
      r: { a: 1, k: [{ t: 0, s: [0] }, { t: 90, s: [360] }] },
      p: { a: 0, k: [100, 100, 0] },
      a: { a: 0, k: [0, 0, 0] },
      s: { a: 0, k: [100, 100, 100] },
    },
    ao: 0,
    shapes: [{
      ty: 'gr',
      it: [
        { ty: 'el', p: { a: 0, k: [0, 0] }, s: { a: 0, k: [130, 130] } },
        {
          ty: 'st', c: { a: 0, k: [1, 1, 1, 1] }, o: { a: 0, k: 100 }, w: { a: 0, k: 8 }, lc: 2,
          d: [{ n: 'd', nm: 'dash', v: { a: 0, k: 160 } }, { n: 'g', nm: 'gap', v: { a: 0, k: 130 } }],
        },
        { ty: 'tr', p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } },
      ],
    }],
    ip: 0, op: 90, st: 0, bm: 0,
  }],
};

let loadingCount = 0;
let loadingAnim = null;
function showLoading(message) {
  loadingCount++;
  const overlay = $('loadingOverlay');
  $('loadingMsg').textContent = message || 'Cargando…';
  overlay.style.display = 'flex';
  if (!loadingAnim && window.lottie) {
    loadingAnim = lottie.loadAnimation({
      container: $('loadingSpinner'), renderer: 'svg', loop: true, autoplay: true,
      animationData: LOADING_LOTTIE_JSON,
    });
  }
}
function hideLoading() {
  loadingCount = Math.max(0, loadingCount - 1);
  if (loadingCount === 0) $('loadingOverlay').style.display = 'none';
}

/* ============================================================
   GLOBOS DE AYUDA — mismas reglas que en el editor: uno a la vez,
   nunca por encima del prelude, de los términos o de la carga, y
   solo cuando el control del que hablan ya está en pantalla.
   ============================================================ */
const TOUR_KEY = 'topitos-tour-editor';
const TOUR_OFF_KEY = TOUR_KEY + ':off';

let tourSeen = new Set();
try { tourSeen = new Set(JSON.parse(sessionStorage.getItem(TOUR_KEY) || '[]')); } catch (e) {}
let tourOff = false;
try { tourOff = sessionStorage.getItem(TOUR_OFF_KEY) === '1'; } catch (e) {}

let activeTip = null;
let tourQueue = [];
let pumpTimer = null;

function saveTourSeen() {
  try { sessionStorage.setItem(TOUR_KEY, JSON.stringify(Array.from(tourSeen))); } catch (e) {}
}

/* "Hay algo encima que exige una decisión" — mientras sea cierto, ningún
   letrero se pinta. Esto es lo que evita que la ayuda aparezca sobre la
   compuerta de términos y condiciones. */
function uiIsBusy() {
  if (!preludeDone || !termsDone) return true;
  const prelude = $('prelude');
  if (prelude && prelude.isConnected) return true;
  const gate = $('termsGate');
  if (gate && gate.style.display !== 'none') return true;
  if ($('loadingOverlay').style.display === 'flex') return true;
  return false;
}

function isOnScreen(el) {
  if (!el || !el.isConnected) return false;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  return r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth;
}

function closeTip() {
  if (!activeTip) return;
  window.removeEventListener('resize', activeTip.place);
  activeTip.el.remove();
  activeTip = null;
}

function clearTipQueue() {
  tourQueue = [];
  clearTimeout(pumpTimer);
}

function queueTips(list) {
  if (tourOff) return;
  tourQueue = list
    .filter(t => !tourSeen.has(t.id))
    .map(t => ({ id: t.id, text: t.text, target: t.target, tries: 0 }));
  pumpQueue();
}

function pumpQueue() {
  clearTimeout(pumpTimer);
  if (activeTip || !tourQueue.length) return;

  const next = tourQueue[0];
  const target = typeof next.target === 'function' ? next.target() : next.target;

  if (uiIsBusy() || !isOnScreen(target)) {
    next.tries++;
    if (next.tries > 40) tourQueue.shift();   // ~10s esperando: ese paso ya no aplica
    pumpTimer = setTimeout(pumpQueue, 250);
    return;
  }

  tourQueue.shift();
  renderTip(next.id, next.text, target);
}

function renderTip(id, text, target) {
  const tip = document.createElement('div');
  tip.className = 'tour-tip';
  tip.innerHTML =
    '<button class="tour-close" type="button" aria-label="Cerrar">✕</button>' +
    '<p></p>' +
    '<div class="tour-row">' +
      '<button class="tour-skip" type="button"></button>' +
      '<button class="tour-ok primary" type="button"></button>' +
    '</div>';
  tip.querySelector('.tour-skip').textContent = t('tourNoMore');
  tip.querySelector('.tour-ok').textContent = t('tourOk');
  tip.querySelector('p').textContent = text;
  $('tourLayer').appendChild(tip);

  const place = () => {
    const rect = target && target.getBoundingClientRect ? target.getBoundingClientRect() : null;
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    let left, top;
    if (rect && rect.width && rect.height) {
      left = rect.left + rect.width / 2 - w / 2;
      top = rect.top > window.innerHeight / 2 ? rect.top - h - 12 : rect.bottom + 12;
    } else {
      left = window.innerWidth / 2 - w / 2;
      top = window.innerHeight / 2 - h / 2;
    }
    tip.style.left = Math.max(12, Math.min(left, window.innerWidth - w - 12)) + 'px';
    tip.style.top = Math.max(12, Math.min(top, window.innerHeight - h - 12)) + 'px';
  };
  place();
  window.addEventListener('resize', place);
  activeTip = { id: id, el: tip, place: place };

  const markSeen = () => {
    tourSeen.add(id);
    saveTourSeen();
    closeTip();
    pumpTimer = setTimeout(pumpQueue, 250);
  };
  tip.querySelector('.tour-close').addEventListener('click', markSeen);
  tip.querySelector('.tour-ok').addEventListener('click', markSeen);
  tip.querySelector('.tour-skip').addEventListener('click', () => {
    tourOff = true;
    try { sessionStorage.setItem(TOUR_OFF_KEY, '1'); } catch (e) {}
    clearTipQueue();
    closeTip();
  });
}

/* En esta pantalla solo hay un consejo: señalar el menú de inicio. El resto
   de los letreros del recorrido viven en el editor 2D (Dibujar.html). */
function tipsForStage() {
  if (tourOff) return;
  queueTips([{
    id: 'inicio',
    text: t(isMobile ? 'tourStartMobile' : 'tourStart'),
    target: () => $('btnCatalog'),
  }]);
}

function maybeStartTour() {
  if (uiIsBusy()) return;
  setTimeout(tipsForStage, 350);
}

function refreshTipsForStage(delay) {
  closeTip();
  clearTipQueue();
  pumpTimer = setTimeout(tipsForStage, delay || 300);
}

/* ============================================================
   MENÚ INICIAL — las tres opciones llevan al editor 2D
   (Dibujar.html) con la intención con la que se quiere arrancar.
   El archivo (SVG/DXF) se lee aquí —dentro del gesto del botón—
   y se transfiere al editor por sessionStorage.
   ============================================================ */
const importScreen = $('importScreen');
const importStatus = $('importStatus');
const fileInput = $('fileInput');
const bgImage = $('bgImage');

function goToDraw(modo) {
  window.location.href = 'Dibujar.html?modo=' + modo;
}

$('btnCatalog').addEventListener('click', () => goToDraw('motivo'));
$('btnSkipImport').addEventListener('click', () => goToDraw('mano'));
$('btnUpload').addEventListener('click', () => fileInput.click());

function setImportStatus(text, isError) {
  importStatus.textContent = text;
  importStatus.classList.toggle('error', !!isError);
}

fileInput.addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') { setImportStatus(t('importPdf'), true); return; }
  if (ext !== 'svg' && ext !== 'dxf') { setImportStatus(t('importUnknown'), true); return; }

  setImportStatus(t('importProcessing'), false);
  showLoading(t('importProcessing'));
  try {
    const text = await file.text();
    try {
      sessionStorage.setItem(FILE_IMPORT_KEY, JSON.stringify({ ext, text, name: file.name }));
    } catch (err) {
      setImportStatus('El archivo es demasiado grande para transferirlo así. Usa un SVG o DXF más liviano.', true);
      return;
    }
    window.location.href = 'Dibujar.html?modo=archivo';
  } catch (err) {
    console.error(err);
    setImportStatus(t('importReadFailed') + err.message, true);
  } finally {
    hideLoading();
    fileInput.value = '';
  }
});

/* ============================================================
   TÉRMINOS Y CONDICIONES — compuerta antes de tocar el editor.
   ============================================================ */
(function setupTermsGate() {
  const gate = $('termsGate');
  let accepted = false;
  try { accepted = sessionStorage.getItem(TERMS_KEY) === '1'; } catch (e) {}
  if (accepted) { gate.style.display = 'none'; termsDone = true; maybeStartTour(); return; }

  const checkbox = $('termsCheckbox');
  const btn = $('btnTermsAccept');
  checkbox.addEventListener('change', () => { btn.disabled = !checkbox.checked; });
  btn.addEventListener('click', () => {
    try { sessionStorage.setItem(TERMS_KEY, '1'); } catch (e) {}
    gate.style.display = 'none';
    termsDone = true;
    maybeStartTour();
  });
})();

/* ============================================================
   FONDO Y PRELUDE DESDE EL SPREADSHEET
   Hoja "background": A1 imagen, B1 escala (10–100), C1 color de app.
   Hoja "PRELUDE":    A2 logo,   B2 escala (1–100), C2 color de fondo.
   Hoja "Tutorial":   A2 video "cómo empezar" (menú inicial).
   ============================================================ */
let tutorialData = {};
let configPromise = null;

function loadConfig() {
  if (!configPromise) {
    configPromise = fetch(CONFIG_URL).then(r => r.json()).catch((err) => {
      console.error('No se pudo cargar la configuración:', err);
      return {};
    });
  }
  return configPromise;
}

async function applyConfig() {
  const data = await loadConfig();

  // En móvil, la hoja "background" tiene una segunda fila (A2/B2/C2) pensada
  // para pantallas angostas; si no está diligenciada, se cae a la de escritorio.
  const mobileCfg = (isMobile && data.mobile) || {};
  const image = mobileCfg.image || data.image;
  const scale = mobileCfg.scale || data.scale;
  const color = mobileCfg.color || data.color;

  if (typeof color === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)) {
    document.documentElement.style.setProperty('--bg', color);
  }
  if (image) {
    bgImage.src = normalizeImageUrl(image);
    const scaleNum = Math.min(100, Math.max(10, Number(scale) || 100));
    bgImage.style.width = scaleNum + '%';
    bgImage.style.height = 'auto';
  }

  // El video del menú inicial se carga en cuanto llega la configuración.
  tutorialData = (data && data.tutorial) || {};
  syncImportVideo();
  return data;
}

/* Los enlaces normales de Drive (/file/d/ID/view) no se pueden usar como
   src de una imagen. Se convierten al endpoint de miniatura, que sí sirve. */
function normalizeImageUrl(url) {
  if (typeof url !== 'string') return '';
  const m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{20,})/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
  return url;
}

function syncImportVideo() {
  const impVid = $('importVideo');
  const src = (tutorialData && tutorialData.inicio) || '';
  if (impVid && impVid.getAttribute('src') !== src) impVid.src = src;
}

/* ---------- PRELUDE ---------- */
async function runPrelude() {
  const prelude = $('prelude');
  if (window.__preludeSeen) { preludeDone = true; if (prelude) prelude.remove(); maybeStartTour(); return; }

  // Si la configuración tarda, se revela la app igual: nadie espera 8s por un logo.
  const data = await Promise.race([
    loadConfig(),
    new Promise(resolve => setTimeout(() => resolve(null), 2500)),
  ]);

  const cfg = (data && data.prelude) || {};
  const logo = normalizeImageUrl(cfg.logo);
  // El color del prelude sale de PRELUDE!C2; si está vacío usa el de la app
  // (background!C1) para que el fundido no tenga costura.
  const color = [cfg.color, data && data.color].find(c => typeof c === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c));
  if (color) prelude.style.background = color;

  if (!logo) { dismissPrelude(prelude, 0); return; }

  const img = $('preludeLogo');
  const scale = Math.min(100, Math.max(1, Number(cfg.scale) || 40));
  img.style.width = scale + '%';
  img.style.height = 'auto';

  await new Promise((resolve) => {
    const done = () => resolve();
    img.onload = done;
    img.onerror = done;
    img.src = logo;
    setTimeout(done, 2500);
  });

  img.classList.add('show');            // fade-in 400ms
  setTimeout(() => dismissPrelude(prelude, 3000), 1600); // sostiene y funde 3s
}

function dismissPrelude(prelude, fadeMs) {
  prelude.classList.add('fading');
  setTimeout(() => {
    prelude.remove();
    preludeDone = true;
    maybeStartTour();
  }, fadeMs + 60);
}

/* ============================================================
   RESTRICCIONES EN CELULAR — en el celular el menú solo ofrece
   la biblioteca de motivos; subir archivos y dibujar a mano son
   de escritorio.
   ============================================================ */
if (isMobile) {
  $('btnUpload').style.display = 'none';
  $('btnSkipImport').style.display = 'none';
  const importHint = $('importHint');
  if (importHint) importHint.textContent = t('importMobileHint');
}

/* ---------- Idiomas ---------- */
document.querySelectorAll('#langStart .ls-opt').forEach((b) => {
  b.addEventListener('click', () => setLanguage(b.dataset.lang));
});
setLanguage(currentLang);

applyConfig();
runPrelude();
</script>
